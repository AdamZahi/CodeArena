---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codearena
  namespace: codearena
  annotations:
    # Larger bodies + longer timeouts for code submissions, websockets, file uploads.
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # WebSocket / STOMP support for /ws
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/server-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # Force HTTPS redirect (Auth0 requires HTTPS).
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # NOTE: Do NOT use nginx.ingress.kubernetes.io/configuration-snippet
    # — the admission webhook for this controller has it disabled.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - codearena.10.0.1.123.nip.io
      secretName: codearena-tls
  rules:
    - host: codearena.10.0.1.123.nip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
